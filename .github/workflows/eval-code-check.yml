name: Eval Code Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/core/docker_eval.py"
      - "src/scripts/ci_evaluate_all.py"
      - "src/data/humaneval_x.py"
      - "src/core/reporting.py"
      - "src/core/schemas.py"
      - "src/tests/test_docker_eval.py"
      - "src/tests/test_ci_evaluate_all.py"
      - "src/tests/test_humaneval_x.py"
      - "src/tests/test_metrics.py"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest src/tests/test_docker_eval.py src/tests/test_ci_evaluate_all.py src/tests/test_humaneval_x.py src/tests/test_metrics.py -v -m "not integration"
