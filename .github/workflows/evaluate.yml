name: HumanEval-X Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/lab/00_get_hands_on/docker_eval.py"
      - "src/lab/00_get_hands_on/run.py"
      - "src/data/humaneval_x.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-eval-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: uv sync --dev
      - name: Pull Go Docker image
        run: docker pull golang:1.26-alpine
      - name: Run integration tests
        run: |
          uv run pytest src/lab/00_get_hands_on/tests/test_docker_eval.py -v \
            -m "integration" \
            --tb=short | tee eval-output.txt
      - name: Format results
        if: always()
        run: |
          echo "# HumanEval-X Evaluation Results" > eval-results.md
          echo "" >> eval-results.md
          echo "**Run:** ${{ github.run_id }}" >> eval-results.md
          echo "**Branch:** ${{ github.ref_name }}" >> eval-results.md
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> eval-results.md
          echo "" >> eval-results.md
          echo '```' >> eval-results.md
          cat eval-output.txt >> eval-results.md
          echo '```' >> eval-results.md
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.md
      - name: Upload translated Go files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translated-go-files
          path: data/translation/target/
