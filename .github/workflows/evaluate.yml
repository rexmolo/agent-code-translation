name: HumanEval-X Evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/translation/target/humaneval-x/**"
      - "src/core/docker_eval.py"
      - "src/scripts/ci_evaluate_all.py"
      - "src/data/humaneval_x.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --dev

      - name: Pull Go Docker image
        run: docker pull golang:1.26-alpine

      - name: Run evaluation for all experiments
        run: uv run python src/scripts/ci_evaluate_all.py

      - name: Write job summary
        if: always()
        run: |
          if [ -f results/comparison.md ]; then
            cat results/comparison.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: results/
