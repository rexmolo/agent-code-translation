name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: uv sync --dev
      - name: Run unit tests
        run: |
          uv run pytest src/lab/00_get_hands_on/tests/ -v \
            -m "not integration" \
            --tb=short \
            --junitxml=test-results.xml | tee test-output.txt
      - name: Format results
        if: always()
        run: |
          echo "# Unit Test Results" > test-results.md
          echo "" >> test-results.md
          echo "**Run:** ${{ github.run_id }}" >> test-results.md
          echo "**Branch:** ${{ github.ref_name }}" >> test-results.md
          echo "**Commit:** ${{ github.sha }}" >> test-results.md
          echo "" >> test-results.md
          echo '```' >> test-results.md
          cat test-output.txt >> test-results.md
          echo '```' >> test-results.md
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results.md
            test-results.xml
