# Pipeline configuration

translation:
  # Number of parallel LLM requests per experiment process.
  # With 5 parallel processes, total concurrent requests = batch_size × 5.
  # Recommended: 5–10 to stay within rate limits.
  batch_size: 5

  # Seconds to wait between successive thread starts within each process.
  # Thread i sleeps (i % batch_size) * thread_stagger_seconds before its LLM call.
  # Set to 0 to disable staggering.
  thread_stagger_seconds: 2

parallel:
  # Number of Docker containers to run concurrently for evaluation.
  # Each container uses up to 512 MB memory, so adjust based on available RAM.
  # Recommended: 10–20 on a machine with 16+ GB RAM.
  batch_size: 10

docker:
  image: "golang:1.26-alpine"
  memory_limit: "512m"
  timeout: 60

repair:
  enabled: true
  rounds: 1
