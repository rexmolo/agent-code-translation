# RAG Configuration
# Switch embedding provider to test the pipeline without an API key.
# After verifying the pipeline works, change to "openai" for production quality.

chromadb:
  host: "localhost"
  port: 8000

embedding:
  # Provider: "default" (free, local) or "openai" (requires OPENAI_API_KEY) or "gemini" (3072 dims, requires GOOGLE_API_KEY)
  provider: "gemini"

  # Provider-specific settings
  default:
    # ChromaDB's built-in ONNX model (all-MiniLM-L6-v2), no API key needed.
    # Dimension: 384. Good enough for pipeline testing.
    model: "all-MiniLM-L6-v2"

  openai:
    # Requires OPENAI_API_KEY in .env
    model: "text-embedding-3-large"
    # Alternatives: "text-embedding-3-small" (cheaper, 1536 dims)

  gemini:
    # Requires GOOGLE_API_KEY in .env
    model: "gemini-embedding-001"
    # Supported dimensions: 768 (small), 1050/1536 (medium), 3072 (full, default)
    # Uses Matryoshka Representation Learning — smaller dims need manual normalization.
    dimensions: 768

# Vertex AI Vector Search configuration (used with Gemini embedding backend)
vertex_ai:
  # Reads from env: GOOGLE_CLOUD_PROJECT, GOOGLE_CLOUD_LOCATION
  index_display_name: "thesis-rag-index"
  endpoint_display_name: "thesis-rag-endpoint"
  dimensions: 3072  # Must match gemini embedding model output

retrieval:
  # Number of results to return per collection
  parallel_corpus_k: 3
  api_mappings_k: 5
  go_docs_k: 3

  # Reciprocal Rank Fusion constant (higher = more uniform weighting)
  rrf_k: 60

# Knowledge base toggles for ablation experiments.
# Set to false to disable a specific knowledge base during retrieval.
knowledge_bases:
  code_snippets: false        # Parallel corpus (Python-Go translation examples)
  api_mappings: true         # Python -> Go API equivalences
  documentation: true        # Go standard library docs & patterns
