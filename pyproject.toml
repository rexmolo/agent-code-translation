[project]
name = "experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.5.2",
    "anthropic>=0.52.0",
    "chromadb>=1.5.2",
    "click>=8.3.1",
    "datasets>=4.6.0",
    "fastembed>=0.8.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-genai>=1.64.0",
    "litellm>=1.81.15",
    "mlflow>=3.10.1",
    "openai>=2.23.0",
    "pandas>=2.2,<3",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "rich>=14.3.2",
    "scipy>=1.17.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-python>=0.25.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires Docker daemon running",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
